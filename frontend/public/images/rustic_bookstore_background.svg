  <ellipse cx="960" cy="260" rx="900" ry="500" fill="url(#lampGlow)"/>
  <ellipse cx="380" cy="200" rx="260" ry="220" fill="url(#lampGlowSmall)"/>
  <ellipse cx="1560" cy="230" rx="300" ry="240" fill="url(#lampGlowSmall)"/>

